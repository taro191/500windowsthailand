  const [size, setSize] = _.useState(3)
  const [rounds, setRounds] = _.useState(1)
  const [scheduleMode, setScheduleMode] = _.useState(&quot;today&quot;)
  const [startDate, setStartDate] = _.useState(() => promoLocalDate())
  const [calendarMonth, setCalendarMonth] = _.useState(() =>
    promoLocalDate().slice(0, 7),
  )
  const [brand, setBrand] = _.useState(&quot;&quot;)
  const [contact, setContact] = _.useState(&quot;&quot;)
  const [tagline, setTagline] = _.useState(&quot;&quot;)
  const [link, setLink] = _.useState(&quot;&quot;)
  const [images, setImages] = _.useState([])
  const [termsAccepted, setTermsAccepted] = _.useState(false)
  const [error, setError] = _.useState(&quot;&quot;)
  const [saved, setSaved] = _.useState(null)
  const [history, setHistory] = _.useState([])
  const [uploading, setUploading] = _.useState(false)
  const [copied, setCopied] = _.useState(false)
  const dialogRef = _.useRef(null)
  const uploadVersion = _.useRef(0)
  const submitted = _.useRef(false)

  _.useEffect(() => {
    if (!isOpen) return
    setSaved(null)
    setCopied(false)
    setTermsAccepted(false)
    setError(&quot;&quot;)
    submitted.current = false
    const requests = se()
    setHistory(
      currentUser &amp;&amp; Array.isArray(requests)
        ? requests.filter((item) => item.userId === currentUser.id)
        : [],
    )
    const previousFocus = document.activeElement
    const previousOverflow = document.body.style.overflow
    document.body.style.overflow = &quot;hidden&quot;
    const frame = requestAnimationFrame(() => dialogRef.current?.focus())
    const onKey = (event) => {
      if (event.key === &quot;Escape&quot;) {
        event.preventDefault()
        onClose()
        return
      }
      if (event.key !== &quot;Tab&quot;) return
      const nodes = [
        ...dialogRef.current.querySelectorAll(
          'button:not([disabled]), input:not([disabled]), textarea, select, a[href], summary, [tabindex=&quot;0&quot;]',
        ),
      ].filter((node) => node.getClientRects().length)
      const first = nodes[0],
        last = nodes[nodes.length - 1]
      if (!first) {
        event.preventDefault()
        return
      }
      if (
        event.shiftKey &amp;&amp;
        (document.activeElement === first ||
          document.activeElement === dialogRef.current)
      ) {
        event.preventDefault()
        last.focus()
      } else if (
        !event.shiftKey &amp;&amp;
        (document.activeElement === last ||
          document.activeElement === dialogRef.current)
      ) {
        event.preventDefault()
        first.focus()
      }
    }
    window.addEventListener(&quot;keydown&quot;, onKey)
    return () => {
      cancelAnimationFrame(frame)
      uploadVersion.current++
      setUploading(false)
      document.body.style.overflow = previousOverflow
      window.removeEventListener(&quot;keydown&quot;, onKey)
      if (previousFocus?.isConnected) previousFocus.focus()
    }
  }, [isOpen, currentUser, onClose])

  if (!isOpen) return null
  const icon = (Component, className = &quot;promo-icon&quot;) =>
    h(Component, { className, &quot;aria-hidden&quot;: true })
  const money = (value) => `${value.toLocaleString(&quot;th-TH&quot;)} บาท`
  const dateLabel = (value) =>
    new Date(`${value}T00:00:00`).toLocaleDateString(&quot;th-TH&quot;, {
      dateStyle: &quot;medium&quot;,
    })
  const price = promoPrice(size, rounds)
  const today = promoLocalDate()
  const currentMonth = today.slice(0, 7)
  const maximumMonthDate = new Date()
  maximumMonthDate.setMonth(maximumMonthDate.getMonth() + 11)
  const maximumMonth = promoLocalDate(maximumMonthDate).slice(0, 7)
  const requests = se()
  const promoAvailability = (value) => {
    const reserved = requests
      .filter((item) => item.startDate === value &amp;&amp; item.status !== &quot;rejected&quot;)
      .reduce((total, item) => total + (Number(item.rounds) || 0), 0)
    return Math.max(0, 4 - reserved)
  }
  const [calendarYear, calendarMonthNumber] = calendarMonth.split(&quot;-&quot;).map(Number)
  const monthStart = new Date(calendarYear, calendarMonthNumber - 1, 1, 12)
  const monthDays = new Date(calendarYear, calendarMonthNumber, 0).getDate()
  const leadingDays = monthStart.getDay()
  const calendarCellCount = Math.ceil((leadingDays + monthDays) / 7) * 7
  const calendarDates = Array.from({ length: calendarCellCount }, (_, index) => {
    const dayNumber = index - leadingDays + 1
    if (dayNumber < 1 || dayNumber > monthDays)
      return { key: `empty-${index}`, inMonth: false }
    const value = `${calendarMonth}-${String(dayNumber).padStart(2, &quot;0&quot;)}`
    return {
      key: value,
      value,
      dayNumber,
      inMonth: true,
      isPast: value < today,
      available: value < today ? 0 : promoAvailability(value),
    }
  })
  const availableRounds = startDate < today ? 0 : promoAvailability(startDate)
  const calendarTitle = monthStart.toLocaleDateString(&quot;th-TH&quot;, {
    month: &quot;long&quot;,
    year: &quot;numeric&quot;,
  })
  const moveCalendarMonth = (offset) => {
    const next = new Date(calendarYear, calendarMonthNumber - 1 + offset, 1, 12)
    const value = promoLocalDate(next).slice(0, 7)
    if (value >= currentMonth &amp;&amp; value <= maximumMonth) setCalendarMonth(value)
  }
  const message = saved
    ? [
        &quot;คำขอโปรโมท&quot;,
        `เลขคำขอ: ${saved.id}`,
        `แบรนด์: ${saved.brand}`,
        `จำนวน: ${saved.size} บาน`,
        `ราคา: ${money(saved.price)}`,
        `จำนวนรอบ: ${saved.rounds} รอบ (${saved.durationHours} ชั่วโมง)`,
        `วันที่โปรโมท: ${dateLabel(saved.startDate)}`,
        `จำนวนรูป: ${saved.images.length} รูป`,
        `รายละเอียด: ${saved.tagline || &quot;—&quot;}`,
        `ลิงก์: ${saved.link || &quot;—&quot;}`,
        `ติดต่อกลับ: ${saved.contact || &quot;ไม่ได้ระบุ&quot;}`,
        &quot;สถานะ: รอตรวจสอบคำขอ&quot;,
        &quot;บันทึกเฉพาะเบราว์เซอร์นี้ ยังไม่มีการเรียกเก็บเงิน&quot;,
      ].join(&quot;\n&quot;)
    : &quot;&quot;
  const change = (setter, value) => {
    setter(value)
    setError(&quot;&quot;)
  }

  const upload = async (event) => {
    const files = [...(event.target.files || [])]
    event.target.value = &quot;&quot;
    if (!files.length || uploading) return
    if (files.length + images.length > size) {
      setError(`แพ็กเกจ ${size} บานเพิ่มรูปได้สูงสุด ${size} รูป กรุณาเลือกใหม่หรือลบรูปเดิม`)
      return
    }
    if (
      files.some(
        (file) =>
          ![&quot;image/jpeg&quot;, &quot;image/png&quot;, &quot;image/webp&quot;].includes(file.type),
      )
    ) {
      setError(&quot;รองรับเฉพาะรูป JPG, PNG และ WebP&quot;)
      return
    }
    if (files.some((file) => file.size > 10 * 1024 * 1024)) {
      setError(&quot;แต่ละรูปต้องมีขนาดไม่เกิน 10 MB&quot;)
      return
    }
    const version = ++uploadVersion.current
    setUploading(true)
    setError(&quot;&quot;)
    try {
      const results = []
      for (const file of files) results.push(await le(file))
      if (version === uploadVersion.current)
        setImages((previous) => [...previous, ...results])
    } catch {
      if (version === uploadVersion.current)
        setError(&quot;อ่านรูปไม่สำเร็จ กรุณาลองรูปอื่น&quot;)
    } finally {
      if (version === uploadVersion.current) setUploading(false)
    }
  }

  const submit = (event) => {
    event.preventDefault()
    if (!currentUser) {
      onClose()
      onOpenAuth(&quot;login&quot;)
      return
    }
    if (submitted.current || uploading) return
    if (
      !brand.trim() ||
      brand.length > 80 ||
      tagline.length > 1200 ||
      contact.length > 160
    ) {
      setError(&quot;กรุณาระบุชื่อแบรนด์ และตรวจสอบความยาวข้อมูลให้ไม่เกินที่กำหนด&quot;)
      return
    }
    if (![2, 3, 4, 6].includes(size) || ![1, 2, 3, 4].includes(rounds)) {
      setError(&quot;กรุณาเลือกจำนวนบานและจำนวนรอบที่รองรับ&quot;)
      return
    }
    if (!promoValidStartDate(startDate)) {
      setError(&quot;กรุณาเลือกวันโปรโมทเป็นวันนี้หรือวันในอนาคต&quot;)
      return
    }
    if (!selectedDate || availableRounds < rounds) {
      setError(`วันที่เลือกเหลือ ${availableRounds} รอบ กรุณาลดจำนวนรอบหรือเลือกวันอื่น`)
      return
    }
    if (link.trim()) {
      try {
        const url = new URL(link.trim())
        if (
          ![&quot;http:&quot;, &quot;https:&quot;].includes(url.protocol) ||
          !url.hostname ||
          url.username ||
          url.password ||
          link.length > 2048
        )
          throw new Error(&quot;url&quot;)
      } catch {
        setError(&quot;ลิงก์ต้องเป็นเว็บไซต์ http:// หรือ https:// ที่ถูกต้อง&quot;)
        return
      }
    }
    if (images.length > size) {
      setError(`กรุณาลดจำนวนรูปให้ไม่เกิน ${size} รูปก่อนส่งคำขอ`)
      return
    }
    if (!termsAccepted) {
      setError(&quot;กรุณาตรวจสอบข้อมูลและยอมรับเงื่อนไข พร้อมรับผิดชอบเนื้อหาที่นำเสนอ&quot;)
      return
    }
    const request = {
      id: `promo_${crypto.randomUUID()}`,
      userId: currentUser.id,
      brand: brand.trim(),
      tagline: tagline.trim(),
      link: link.trim(),
      contact: contact.trim(),
      images: [...images],
      // Retain the first image for the existing approved-ad renderer.
      image: images[0] || &quot;&quot;,
      size,
      price: promoPrice(size, rounds),
      rounds,
      durationHours: rounds * 6,
      scheduleMode,
      startDate,
      termsAccepted: true,
      termsAcceptedAt: new Date().toISOString(),
      createdAt: new Date().toISOString(),
      status: &quot;pending&quot;,
    }
    submitted.current = true
    if (!ce(request)) {
      submitted.current = false
      setError(&quot;บันทึกไม่สำเร็จ พื้นที่ในเบราว์เซอร์อาจเต็ม กรุณาลดจำนวนหรือขนาดรูป&quot;)
      return
    }
    setSaved(request)
    setHistory((previous) => [request, ...previous])
    setError(&quot;&quot;)
    requestAnimationFrame(() =>
      dialogRef.current?.querySelector(&quot;.promo-success-title&quot;)?.focus(),
    )
  }

  const field = (id, label, value, setter, props = {}) =>
    h(
      &quot;label&quot;,
      { className: &quot;promo-field&quot;, htmlFor: id },
      h(&quot;span&quot;, { className: &quot;promo-field-label&quot; }, label),
      h(&quot;input&quot;, {
        id,
        value,
        onChange: (event) => change(setter, event.target.value),
        className: &quot;promo-input&quot;,
        ...props,
      }),
    )
  const sectionTitle = (number, title, hint) =>
    h(
      &quot;div&quot;,
      { className: &quot;promo-section-heading&quot; },
      h(&quot;span&quot;, { className: &quot;promo-step&quot; }, number),
      h(&quot;h4&quot;, null, title),
      hint &amp;&amp; h(&quot;span&quot;, { className: &quot;promo-subtle&quot; }, hint),
    )

  return h(
    &quot;div&quot;,
    { className: &quot;promo-backdrop&quot;, onClick: onClose },
    h(
      &quot;section&quot;,
      {
        ref: dialogRef,
        className: &quot;promo-dialog&quot;,
        role: &quot;dialog&quot;,
        &quot;aria-modal&quot;: true,
        &quot;aria-labelledby&quot;: &quot;promo-title&quot;,
        &quot;aria-describedby&quot;: &quot;promo-description&quot;,
        tabIndex: -1,
        onClick: (event) => event.stopPropagation(),
      },
      h(&quot;div&quot;, { className: &quot;promo-handle&quot;, &quot;aria-hidden&quot;: true }),
      h(
        &quot;header&quot;,
        { className: &quot;promo-header&quot; },
        h(&quot;span&quot;, { className: &quot;promo-brand-icon&quot; }, icon(gn)),
        h(
          &quot;div&quot;,
          { className: &quot;promo-header-text&quot; },
          h(&quot;span&quot;, { className: &quot;promo-eyebrow&quot; }, &quot;500 WINDOWS · PROMOTE&quot;),
          h(&quot;h3&quot;, { id: &quot;promo-title&quot; }, &quot;ให้คนเห็นแบรนด์คุณ&quot;),
          h(
            &quot;p&quot;,
            { id: &quot;promo-description&quot; },
            &quot;เลือกจำนวนบาน · เลือกรอบ 6 ชั่วโมง · กำหนดวันโปรโมท&quot;,
          ),
        ),
        h(
          &quot;button&quot;,
          {
            type: &quot;button&quot;,
            className: &quot;promo-close&quot;,
            onClick: onClose,
            &quot;aria-label&quot;: &quot;ปิดโปรโมท&quot;,
          },
          icon(B),
        ),
      ),
      saved
        ? h(
            &quot;div&quot;,
            { className: &quot;promo-success promo-scroll&quot; },
            h(&quot;span&quot;, { className: &quot;promo-success-icon&quot; }, icon(Yt)),
            h(
              &quot;h4&quot;,
              { tabIndex: -1, className: &quot;promo-success-title&quot; },
              &quot;บันทึกคำขอแล้ว&quot;,
            ),
            h(
              &quot;p&quot;,
              null,
              &quot;บันทึกแพ็กเกจ ราคา ระยะเวลา และวันที่เริ่มตามที่คุณเลือกแล้ว สถานะ: รอตรวจสอบคำขอ&quot;,
            ),
            h(
              &quot;div&quot;,
              { className: &quot;promo-request-summary&quot; },
              h(&quot;strong&quot;, null, saved.brand),
              h(
                &quot;span&quot;,
                null,
                `${saved.size} บาน · ${saved.rounds} รอบ / ${saved.durationHours} ชม. · ${money(saved.price)}`,
              ),
              h(
                &quot;small&quot;,
                null,
                `วันที่โปรโมท: ${dateLabel(saved.startDate)} · ${saved.images.length} รูป`,
              ),
              saved.contact &amp;&amp; h(&quot;small&quot;, null, `ติดต่อกลับ: ${saved.contact}`),
              h(&quot;small&quot;, null, `เลขคำขอ: ${saved.id}`),
              h(
                &quot;small&quot;,
                null,
                &quot;บันทึกเฉพาะเบราว์เซอร์นี้ ยังไม่ได้ส่งถึงทีมงาน และยังไม่มีการเรียกเก็บเงิน&quot;,
              ),
            ),
            h(
              &quot;details&quot;,
              { className: &quot;promo-preview&quot; },
              h(
                &quot;summary&quot;,
                null,
                h(&quot;span&quot;, null, &quot;ดูรายละเอียดที่บันทึก&quot;),
                icon(Rt, &quot;promo-chevron&quot;),
              ),
              h(
                &quot;pre&quot;,
                { className: &quot;promo-content-text promo-preview-content&quot; },
                message,
              ),
              saved.images.length > 0 &amp;&amp;
                h(
                  &quot;div&quot;,
                  { className: &quot;promo-image-grid&quot; },
                  ...saved.images.map((image, index) =>
                    h(
                      &quot;div&quot;,
                      { key: index, className: &quot;promo-image-card&quot; },
                      h(&quot;img&quot;, { src: image, alt: `รูปที่บันทึก ${index + 1}` }),
                    ),
                  ),
                ),
            ),
            h(
              &quot;button&quot;,
              {
                type: &quot;button&quot;,
                className: &quot;promo-secondary&quot;,
                onClick: async () => {
                  try {
                    await navigator.clipboard.writeText(message)
                    setCopied(true)
                    setError(&quot;&quot;)
                  } catch {
                    setError(
                      &quot;คัดลอกไม่สำเร็จ เปิดรายละเอียดที่บันทึกเพื่อเลือกและคัดลอกข้อความเองได้&quot;,
                    )
                  }
                },
              },
              copied ? &quot;คัดลอกรายละเอียดแล้ว&quot; : &quot;คัดลอกรายละเอียดคำขอ&quot;,
            ),
            h(
              &quot;span&quot;,
              { className: &quot;promo-subtle&quot;, role: &quot;status&quot; },
              copied
                ? &quot;เก็บรายละเอียดนี้ไว้สำหรับอ้างอิงได้&quot;
                : &quot;ตรวจสอบรายละเอียดที่บันทึกได้ด้านบน&quot;,
            ),
            error &amp;&amp; h(&quot;p&quot;, { className: &quot;promo-error&quot;, role: &quot;alert&quot; }, error),
            h(
              &quot;button&quot;,
              {
                type: &quot;button&quot;,
                className: &quot;promo-text-button&quot;,
                onClick: onClose,
              },
              &quot;กลับไปดูหน้าต่าง&quot;,
            ),
          )
        : h(
            &quot;form&quot;,
            { className: &quot;promo-form&quot;, onSubmit: submit },
            h(
              &quot;div&quot;,
              { className: &quot;promo-scroll&quot; },
              h(
                &quot;div&quot;,
                { className: &quot;promo-intro&quot; },
                h(&quot;span&quot;, { className: &quot;promo-intro-icon&quot; }, icon(gn)),
                h(
                  &quot;div&quot;,
                  null,
                  h(&quot;strong&quot;, null, &quot;ราคาและเงื่อนไขการโปรโมท&quot;),
                  h(
                    &quot;p&quot;,
                    null,
                    &quot;1 รอบใช้เวลา 6 ชั่วโมง ราคา 30 บาทต่อหน้าต่าง 1 บาน · เลือกแพ็กเกจ 2 / 3 / 4 / 6 บานได้เหมือนเดิม&quot;,
                  ),
                ),
              ),
              h(
                &quot;section&quot;,
                { className: &quot;promo-section&quot; },
                sectionTitle(&quot;01&quot;, &quot;เลือกแพ็กเกจโปรโมท&quot;, &quot;30 บาท / บาน / รอบ&quot;),
                h(
                  &quot;div&quot;,
                  {
                    className: &quot;promo-packages&quot;,
                    role: &quot;group&quot;,
                    &quot;aria-label&quot;: &quot;จำนวนบานที่ต้องการโปรโมท&quot;,
                  },
                  ...O.map((count) =>
                    h(
                      &quot;button&quot;,
                      {
                        key: count,
                        type: &quot;button&quot;,
                        className: `promo-package ${
                          count === size ? &quot;is-selected&quot; : &quot;&quot;
                        }`,
                        &quot;aria-pressed&quot;: count === size,
                        disabled: uploading,
                        onClick: () => change(setSize, count),
                      },
                      count === 3 &amp;&amp;
                        h(&quot;span&quot;, { className: &quot;promo-recommend&quot; }, &quot;แนะนำ&quot;),
                      h(&quot;span&quot;, { className: &quot;promo-package-number&quot; }, count),
                      h(&quot;span&quot;, { className: &quot;promo-package-label&quot; }, &quot;บาน&quot;),
                      h(
                        &quot;span&quot;,
                        { className: &quot;promo-package-price&quot; },
                        `${money(promoPrice(count, 1))} / รอบ`,
                      ),
                      h(
                        &quot;span&quot;,
                        { className: &quot;promo-radio&quot;, &quot;aria-hidden&quot;: true },
                        count === size &amp;&amp; h(&quot;span&quot;),
                      ),
                    ),
                  ),
                ),
                images.length > size &amp;&amp;
                  h(
                    &quot;p&quot;,
                    { className: &quot;promo-error&quot;, role: &quot;alert&quot; },
                    `มี ${images.length} รูป กรุณาลบให้เหลือไม่เกิน ${size} รูปก่อนส่งคำขอ`,
                  ),
                h(
                  &quot;div&quot;,
                  { className: &quot;promo-schedule&quot; },
                  h(
                    &quot;div&quot;,
                    { className: &quot;promo-section-heading&quot; },
                    h(&quot;h4&quot;, null, &quot;เลือกรูปแบบการจอง&quot;),
                    h(
                      &quot;span&quot;,
                      { className: &quot;promo-subtle&quot;, role: &quot;status&quot; },
                      availableRounds
                        ? `วันที่เลือกว่าง ${availableRounds} รอบ`
                        : &quot;วันที่เลือกเต็ม&quot;,
                    ),
                  ),
                  h(
                    &quot;div&quot;,
                    { className: &quot;promo-mode-tabs&quot;, role: &quot;group&quot;, &quot;aria-label&quot;: &quot;รูปแบบการเลือกวัน&quot; },
                    ...[
                      [&quot;today&quot;, &quot;โปรโมทวันนี้&quot;],
                      [&quot;calendar&quot;, &quot;เลือกวันจากปฏิทิน&quot;],
                    ].map(([mode, label]) =>
                      h(
                        &quot;button&quot;,
                        {
                          key: mode,
                          type: &quot;button&quot;,
                          className: `promo-mode ${scheduleMode === mode ? &quot;is-selected&quot; : &quot;&quot;}`,
                          &quot;aria-pressed&quot;: scheduleMode === mode,
                          onClick: () => {
                            setScheduleMode(mode)
                            if (mode === &quot;today&quot;) setStartDate(today)
                            else setCalendarMonth(startDate.slice(0, 7))
                            setError(&quot;&quot;)
                          },
                        },
                        label,
                      ),
                    ),
                  ),

/* Readable type scale shared by the prototype and promotion flow. */
:root {
  --app-font-body: 'Prompt', sans-serif;
  --app-text-caption: .75rem;
  --app-text-meta: .8125rem;
  --app-text-label: .875rem;
  --app-text-body: 1rem;
  --app-leading-body: 1.65;
  --text-xs: var(--app-text-label);
  --text-xs--line-height: var(--app-leading-body);
  --text-sm: var(--app-text-body);
  --text-sm--line-height: var(--app-leading-body);
}

body[class] {
  font-family: var(--app-font-body);
  font-size: var(--app-text-body);
  line-height: var(--app-leading-body);
}

#root [class*=&quot;font-&quot;][class*=&quot;Prompt&quot;] {
  font-family: var(--app-font-body);
}

#root .font-mono {
  font-family: 'JetBrains Mono', 'Prompt', monospace;
}

/* Keep the miniature window grid and icon-sized badges at their original scale. */
#root :is([class~=&quot;text-[9px]&quot;], [class~=&quot;text-[10px]&quot;]):not([id^=&quot;window-&quot;].aspect-square *) {
  font-size: var(--app-text-caption);
  line-height: var(--app-leading-body);
}

#root [class~=&quot;text-[11px]&quot;] {
  font-size: var(--app-text-meta);
  line-height: var(--app-leading-body);
}

#root .font-light:is(.text-xs, .text-sm, [class*=&quot;text-[&quot;]) {
  font-weight: 400;
}

#root :is(input:not([type=&quot;checkbox&quot;]):not([type=&quot;radio&quot;]):not([type=&quot;file&quot;]), textarea, select) {
  font-family: var(--app-font-body);
  font-size: var(--app-text-body);
  line-height: var(--app-leading-body);
}

#root p {
  line-height: var(--app-leading-body);
}
/* Scoped extension of the attached app's dark purple and rose palette. */
.promo-backdrop {
  --promo-bg: #09080e;
  --promo-surface: #100c1c;
  --promo-surface-active: #1c1432;
  --promo-border: rgb(88 28 135 / 35%);
  --promo-text: #fafaf9;
  --promo-muted: #a8a29e;
  --promo-dim: #78716c;
  --promo-accent: #fda4af;
  --promo-orange: #f97316;
  --promo-fuchsia: #d946ef;
  --promo-radius: 12px;
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgb(0 0 0 / 78%);
  backdrop-filter: blur(8px);
  font-family: 'Prompt', sans-serif;
  color: var(--promo-text);
  font-size: 13px;
}
.promo-dialog {
  width: 100%;
  max-width: 510px;
  max-height: min(94dvh, 900px);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--promo-border);
  border-radius: 24px;
  background: var(--promo-bg);
  box-shadow: 0 32px 100px rgb(0 0 0 / 50%);
  overflow: hidden;
  outline: none;
}
.promo-dialog button, .promo-dialog a, .promo-dialog summary, .promo-upload { cursor: pointer; }
.promo-dialog button:disabled { cursor: not-allowed; opacity: .4; }
.promo-dialog :focus-visible { outline: 2px solid var(--promo-accent); outline-offset: 4px; }
.promo-icon { width: 19px; height: 19px; flex-shrink: 0; }
.promo-handle { display: none; }
.promo-header { display: flex; align-items: center; gap: 13px; padding: 23px 24px 21px; border-bottom: 1px solid var(--promo-border); flex-shrink: 0; }
.promo-brand-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--promo-accent); border: 1px solid rgb(251 113 133 / 25%); background: linear-gradient(140deg, rgb(249 115 22 / 12%), rgb(217 70 239 / 12%)); }
.promo-brand-icon .promo-icon { width: 23px; height: 23px; }
.promo-header-text { flex: 1; min-width: 0; }
.promo-eyebrow { display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9px; letter-spacing: 1.6px; color: var(--promo-accent); font-weight: 700; margin-bottom: 5px; }
.promo-header h3 { font-size: 19px; font-weight: 600; letter-spacing: -.3px; line-height: 1.5; }
.promo-header p { color: var(--promo-muted); font-size: 11px; margin-top: 3px; font-weight: 300; }
.promo-close { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--promo-radius); color: var(--promo-muted); background: var(--promo-surface); flex-shrink: 0; }
.promo-close:hover { color: var(--promo-text); background: var(--promo-surface-active); }
.promo-form { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.promo-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 22px 24px; scrollbar-width: thin; scrollbar-color: var(--promo-border) transparent; }
.promo-intro { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid rgb(249 115 22 / 18%); border-radius: var(--promo-radius); background: linear-gradient(100deg, rgb(249 115 22 / 7%), rgb(217 70 239 / 4%)); margin-bottom: 25px; }
.promo-intro-icon { color: #fdba74; }
.promo-intro strong { font-size: 12px; font-weight: 500; }
.promo-intro p { color: var(--promo-muted); font-size: 10px; margin-top: 4px; font-weight: 300; }
.promo-pill { display: inline-block; flex-shrink: 0; margin-left: auto; font-size: 9px; line-height: 1.8; color: #fcd34d; padding: 3px 7px; border-radius: 6px; background: rgb(245 158 11 / 9%); white-space: nowrap; }
.promo-section + .promo-section { margin-top: 25px; }
.promo-section-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
.promo-step { font-size: 10px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--promo-accent); }
.promo-section-heading h4 { font-weight: 500; font-size: 14px; }
.promo-section-heading > .promo-subtle { margin-left: auto; }
.promo-subtle { color: var(--promo-dim); font-size: 10px; font-weight: 300; line-height: 1.8; }
.promo-packages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
.promo-package { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 17px 6px 12px; border: 1px solid var(--promo-border); border-radius: var(--promo-radius); background: var(--promo-surface); transition: border-color .18s, background .18s; }
.promo-package:hover { border-color: rgb(251 113 133 / 50%); }
.promo-package.is-selected { border-color: #fb7185; background: linear-gradient(145deg, rgb(249 115 22 / 8%), rgb(217 70 239 / 10%)); box-shadow: inset 0 0 0 1px rgb(251 113 133 / 10%); }
.promo-recommend { position: absolute; top: -9px; font-size: 9px; border-radius: 5px; padding: 2px 9px; color: white; background: linear-gradient(100deg, var(--promo-orange), var(--promo-fuchsia)); }
.promo-package-number { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 27px; font-weight: 600; line-height: 1.2; }
.promo-package-label { color: var(--promo-muted); font-size: 10px; }
.promo-radio { width: 12px; height: 12px; border: 1px solid #57534e; border-radius: 50%; margin-top: 8px; display: grid; place-items: center; }
.is-selected .promo-radio { border-color: #fb7185; }
.promo-radio > span { width: 6px; height: 6px; background: #fb7185; border-radius: 50%; }
.promo-placement { display: flex; align-items: center; gap: 13px; margin-top: 12px; padding: 11px 12px; background: var(--promo-surface); border-radius: 10px; }
.promo-mini-windows { display: grid; grid-template-columns: repeat(3, 22px); gap: 3px; }
.promo-mini-windows > span { width: 22px; height: 18px; border: 1px solid var(--promo-border); border-radius: 3px; display: grid; place-items: center; }
.promo-mini-windows .is-active { background: linear-gradient(130deg, var(--promo-orange), var(--promo-fuchsia)); border-color: transparent; }
.promo-mini-windows .promo-icon { width: 11px; height: 11px; }
.promo-placement strong { font-size: 11px; font-weight: 400; }
.promo-placement > div:last-child > span { display: block; font-size: 10px; color: var(--promo-dim); margin-top: 3px; }
.promo-field { display: block; margin-bottom: 14px; }
.promo-field-label { display: block; margin-bottom: 7px; font-size: 11px; color: #d6d3d1; }
.promo-required { color: var(--promo-accent); }
.promo-input { width: 100%; min-height: 45px; border-radius: 10px; padding: 11px 13px; background: var(--promo-surface); border: 1px solid var(--promo-border); font-size: 12px; color: var(--promo-text); transition: border-color .18s; }
.promo-input::placeholder { color: #78716c; font-weight: 300; }
.promo-input:focus { outline: none; border-color: rgb(251 113 133 / 65%); box-shadow: 0 0 0 3px rgb(251 113 133 / 6%); }
.promo-options { margin-top: 3px; }
.promo-dialog summary { display: flex; align-items: center; gap: 8px; padding: 12px 0; list-style: none; color: var(--promo-muted); font-size: 11px; }
.promo-dialog summary::-webkit-details-marker { display: none; }
.promo-dialog summary:hover { color: var(--promo-text); }
.promo-dialog summary small { font-size: 9px; color: var(--promo-dim); margin-left: auto; }
.promo-dialog summary .promo-icon { width: 16px; height: 16px; color: var(--promo-accent); }
.promo-chevron { width: 13px; height: 13px; flex-shrink: 0; color: var(--promo-dim); transform: rotate(90deg); transition: transform .2s; }
.promo-dialog details[open] > summary .promo-chevron { transform: rotate(-90deg); }
.promo-options-content { padding-top: 10px; }
.promo-upload { display: flex; align-items: center; gap: 12px; padding: 15px; margin-bottom: 14px; background: var(--promo-surface); border: 1px dashed rgb(126 34 206 / 50%); border-radius: var(--promo-radius); }
.promo-upload > .promo-icon { color: var(--promo-accent); }
.promo-upload img { width: 46px; height: 46px; border-radius: 7px; object-fit: cover; }
.promo-upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.promo-upload:focus-within { outline: 2px solid var(--promo-accent); outline-offset: 3px; }
